name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {php: '8.3', laravel: '12.*', testbench: '^10.0'}
          - {php: '8.4', laravel: '12.*', testbench: '^10.0'}
          - {php: '8.3', laravel: '13.*', testbench: '^11.0'}
          - {php: '8.4', laravel: '13.*', testbench: '^11.0'}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Resolve dependencies
        run: |
          composer require --no-update "illuminate/support:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --no-interaction
      - run: composer validate --strict
      - run: composer test
